{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: n8n
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.postgres.clusterName }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.postgres.clusterName }}
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
# Alerts for the ways this deployment actually fails. Routing them somewhere
# (Alertmanager receivers) is environment-specific and left to the operator
# -- see docs/operations.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: n8n
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  groups:
    - name: n8n
      rules:
        - alert: N8nMainDown
          expr: absent(up{namespace="{{ .Release.Namespace }}", pod=~"n8n-main-.*"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The n8n main process is down.
            description: No editor, no API, and schedule and polling triggers are not firing. Production webhooks are still accepted and queued.
        - alert: N8nWebhookProcessorsDown
          expr: absent(up{namespace="{{ .Release.Namespace }}", pod=~"n8n-webhook-.*"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No n8n webhook processor is up.
            description: Every production webhook call is failing at the edge.
        - alert: N8nQueueBacklog
          expr: max(n8n_scaling_mode_queue_jobs_waiting{namespace="{{ .Release.Namespace }}"}) > {{ mul .Values.worker.autoscaling.waitingJobsPerWorker .Values.worker.autoscaling.maxReplicas }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Executions are waiting in the queue faster than workers drain it.
            description: The backlog has been above what the maximum number of workers is sized for during 15 minutes. Raise worker.autoscaling.maxReplicas or worker.concurrency, or look for a stuck workflow.
        - alert: N8nWorkerRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", pod=~"n8n-worker-.*"}[30m]) > 3
          labels:
            severity: warning
          annotations:
            summary: An n8n worker keeps restarting.
            description: Usually the memory limit - a workflow loading large payloads. Every restart loses the executions that worker was running.
    - name: n8n-data
      rules:
        - alert: N8nPostgresDown
          expr: absent(cnpg_collector_up{namespace="{{ .Release.Namespace }}"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No PostgreSQL instance of n8n is reporting.
        - alert: N8nPostgresNoStandby
          expr: count(cnpg_collector_up{namespace="{{ .Release.Namespace }}"} == 1) < {{ .Values.postgres.instances }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The n8n database is running without its standby.
            description: A failure of the remaining instance now means downtime and a restore from backup.
        {{- if .Values.postgres.backup.enabled }}
        - alert: N8nPostgresWalArchivingFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count{namespace="{{ .Release.Namespace }}"}[15m]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: PostgreSQL cannot archive WAL to object storage.
            description: Point-in-time recovery is degrading by the minute, and unarchived WAL accumulates on the data disk until it fills. Check the instance pod log for the barman error - most often the workload identity or its role on the container.
        - alert: N8nPostgresBackupTooOld
          expr: time() - max(cnpg_collector_last_available_backup_timestamp{namespace="{{ .Release.Namespace }}"}) > 129600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: The newest base backup of the n8n database is older than 36 hours.
        {{- end }}
        - alert: N8nVolumeFillingUp
          expr: kubelet_volume_stats_available_bytes{namespace="{{ .Release.Namespace }}"} / kubelet_volume_stats_capacity_bytes{namespace="{{ .Release.Namespace }}"} < 0.2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: A volume in the n8n namespace has less than 20% free.
            description: "{{ "{{ $labels.persistentvolumeclaim }}" }} - for the database, lower executions.maxAgeHours or grow postgres.storage.size (the storage class allows expansion)."
{{- end }}
