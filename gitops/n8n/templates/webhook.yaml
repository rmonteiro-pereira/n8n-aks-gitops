apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-webhook
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: {{ .Values.webhook.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        {{- include "n8n.labels" . | nindent 8 }}
        app.kubernetes.io/component: webhook
      annotations:
        {{- include "n8n.configChecksum" . | nindent 8 }}
    spec:
      {{- include "n8n.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: 60
      {{- include "n8n.spread" "webhook" | nindent 6 }}
      containers:
        - name: n8n
          image: {{ include "n8n.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["webhook"]
          {{- include "n8n.env" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 5678
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
          {{- include "n8n.containerSecurity" . | nindent 10 }}
          {{- include "n8n.volumeMounts" . | nindent 10 }}
      {{- include "n8n.volumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-webhook
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: webhook
  ports:
    - name: http
      port: 5678
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: n8n-webhook
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: webhook
