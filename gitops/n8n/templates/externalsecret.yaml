{{- if .Values.secrets.externalSecret.enabled }}
# The secrets n8n needs that are not generated in-cluster, pulled from
# Key Vault. (The database password is generated and owned by CloudNativePG.)
#
#   encryption-key   encrypts every credential stored in n8n. It must never
#                    change for the life of the database: rotate it and the
#                    stored credentials are unreadable. The vault has purge
#                    protection for this one value.
#   redis-password   authenticates n8n and KEDA to the queue.
#   runners-auth-token  shared between n8n and its task-runner sidecars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.externalSecret.storeName }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: encryption-key
      remoteRef:
        key: {{ .Values.secrets.externalSecret.keys.encryptionKey }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: redis-password
      remoteRef:
        key: {{ .Values.secrets.externalSecret.keys.redisPassword }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: runners-auth-token
      remoteRef:
        key: {{ .Values.secrets.externalSecret.keys.runnersAuthToken }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
