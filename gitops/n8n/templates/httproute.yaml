{{- if .Values.gateway.enabled }}
# Routing by path, most specific first:
#
#   /webhook, /webhook-waiting,      -> webhook processors
#   /form, /form-waiting                (everything a third party or an end
#                                        user calls on an ACTIVE workflow)
#   /mcp                             -> main, no timeout
#   /rest/push                       -> main, no timeout (editor live channel)
#   everything else                  -> main (editor, REST API, and the
#                                        -test endpoints of the editor)
#
# PathPrefix matches whole path elements, so `/webhook` does not swallow
# `/webhook-test`, and `/form` does not swallow `/form-test`.
#
# /mcp (MCP Server Trigger) is a long-lived streaming connection that must
# always reach the SAME process. n8n requires a single replica for it when
# webhook processors are scaled out; the single main pod is that replica
# here, so MCP triggers share main's availability.
#
# Defaults the Gateway API would fill in (group, kind, weight, match type)
# are written out so the live object equals the manifest -- see the note in
# gitops/platform-config/templates/gateway.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
        - path:
            type: PathPrefix
            value: /webhook-waiting
        - path:
            type: PathPrefix
            value: /form
        - path:
            type: PathPrefix
            value: /form-waiting
      timeouts:
        request: {{ .Values.gateway.timeouts.webhook }}
      backendRefs:
        - group: ""
          kind: Service
          name: n8n-webhook
          port: 5678
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /rest/push
        - path:
            type: PathPrefix
            value: /mcp
      # 0s disables the request timeout: this is a long-lived WebSocket (or
      # server-sent events) connection, kept open for as long as the editor
      # tab is.
      timeouts:
        request: 0s
      backendRefs:
        - group: ""
          kind: Service
          name: n8n-main
          port: 5678
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: {{ .Values.gateway.timeouts.editor }}
      backendRefs:
        - group: ""
          kind: Service
          name: n8n-main
          port: 5678
          weight: 1
{{- end }}
