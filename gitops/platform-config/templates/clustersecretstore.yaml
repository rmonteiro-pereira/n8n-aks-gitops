# The one way secrets enter the cluster: External Secrets reading Key Vault
# with workload identity. No client secret, nothing to rotate.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "azure.keyVaultUrl is required" .Values.azure.keyVaultUrl | quote }}
      tenantId: {{ .Values.azure.tenantId | quote }}
      serviceAccountRef:
        name: {{ .Values.externalSecrets.serviceAccount }}
        namespace: {{ .Values.externalSecrets.namespace }}
