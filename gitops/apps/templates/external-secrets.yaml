# External Secrets Operator. Its ServiceAccount is the federated subject of
# the `eso` identity in infra/azure/identity.tf -- namespace and name must
# match that file exactly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ .Values.charts.externalSecrets.repoURL }}
    chart: {{ .Values.charts.externalSecrets.chart }}
    targetRevision: {{ .Values.charts.externalSecrets.version | quote }}
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets
          annotations:
            azure.workload.identity/client-id: {{ .Values.azure.identities.externalSecrets | quote }}
            azure.workload.identity/tenant-id: {{ .Values.azure.tenantId | quote }}
        podLabels:
          azure.workload.identity/use: "true"
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            memory: 256Mi
  destination:
    {{- include "apps.destination" "external-secrets" | nindent 4 }}
  syncPolicy:
    {{- include "apps.syncPolicy" . | nindent 4 }}
