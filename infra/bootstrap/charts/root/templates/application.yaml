apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: {{ .Release.Namespace }}
spec:
  project: n8n-platform
  source:
    repoURL: {{ required "repoUrl is required" .Values.repoUrl | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: gitops/apps
    helm:
      valueFiles:
        - values.yaml
        - env/{{ .Values.environment }}.yaml
      parameters:
        - name: targetRevision
          value: {{ .Values.targetRevision | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
