apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: {{ .Release.Namespace }}
spec:
  project: n8n-platform
  source:
    repoURL: {{ required "repoUrl is required" .Values.repoUrl | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: gitops/apps
    helm:
      valueFiles:
        - values.yaml
        - env/{{ .Values.environment }}.yaml
        - env/{{ .Values.environment }}.overrides.yaml
      ignoreMissingValueFiles: true
      parameters:
        - name: targetRevision
          value: {{ .Values.targetRevision | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Unlimited. A wave that waits on something outside the cluster (DNS,
    # a certificate) must not exhaust a retry budget: once the root's sync
    # operation has failed for good, nothing starts another one until the
    # next commit, and the later waves are never created.
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
