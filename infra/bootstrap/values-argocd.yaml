# ArgoCD is not exposed. Reach the UI with
#   kubectl -n argocd port-forward svc/argocd-server 8080:443
# and sign in as admin with the generated initial secret, then rotate it.

dex:
  enabled: false

notifications:
  enabled: false

configs:
  cm:
    # Sync waves between Applications only mean something if ArgoCD can tell
    # when a child Application is healthy. The health check for the
    # Application kind was removed from the defaults in 1.8; without this the
    # app-of-apps considers every child "healthy" the instant it is created
    # and the waves in gitops/apps collapse into a race.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

    # The built-in Gateway health check reports Degraded while a listener's
    # certificate Secret does not exist yet. On a first install that is the
    # normal state for as long as DNS and the ACME challenge take -- and a
    # Degraded resource FAILS the sync wave, where a Progressing one just
    # makes it wait. Degraded is kept for a Gateway the controller rejected.
    resource.customizations.health.gateway.networking.k8s.io_Gateway: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the Gateway to be programmed"
      if obj.status == nil or obj.status.conditions == nil then
        return hs
      end
      local programmed = false
      for _, c in ipairs(obj.status.conditions) do
        if c.type == "Accepted" and c.status == "False" then
          hs.status = "Degraded"
          hs.message = c.message
          return hs
        end
        if c.type == "Programmed" and c.status == "True" then
          programmed = true
        end
      end
      if not programmed then
        return hs
      end
      if obj.status.listeners ~= nil then
        for _, l in ipairs(obj.status.listeners) do
          if l.conditions ~= nil then
            for _, c in ipairs(l.conditions) do
              if (c.type == "Programmed" or c.type == "ResolvedRefs") and c.status == "False" then
                hs.message = "Listener " .. l.name .. ": " .. (c.message or c.reason or "not ready")
                return hs
              end
            end
          end
        end
      end
      hs.status = "Healthy"
      hs.message = "Gateway is programmed"
      return hs

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

applicationSet:
  enabled: false

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
